<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de Salário</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-100 antialiased">
  <div class="mx-auto max-w-4xl p-6">
    <header class="mb-6 flex items-center justify-between">
      <h1 class="text-xl font-semibold tracking-tight">O Calendário</h1>
    </header>
	
    <div class="grid gap-6 md:grid-cols-3">
      <section class="md:col-span-2 space-y-4">
        <div class="rounded-2xl border border-zinc-200 bg-zinc-200/30 p-5">
          <div class="mb-2 grid grid-cols-7 text-center text-[0.70rem] font-medium tracking-wide text-zinc-400">
            <div>DOM</div>
            <div>SEG</div>
            <div>TER</div>
            <div>QUA</div>
            <div>QUI</div>
            <div>SEX</div>
            <div>SÁB</div>
          </div>
          <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
        </div>
		
		<section class="md:col-span-2">
			<div class="relative">
			  <button id="copyBtn" class="absolute right-2 top-2 z-10 rounded-lg border border-zinc-200 
				bg-zinc-400/60 p-2 hover:bg-zinc-500/60 focus:outline-none focus:ring-2 focus:ring-zinc-500 disabled:opacity-40 disabled:cursor-not-allowed" title="Copiar resultado" aria-label="Copiar resultado">
				<svg id="iconCopy" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
				<svg id="iconCheck" xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 12-12-1.5-1.5z"/></svg>
			  </button>
			  <div id="output" class="whitespace-pre-wrap rounded-2xl border border-zinc-200 bg-zinc-200/30 p-4 pr-12 font-mono text-sm min-h-12"></div>
			</div>
		</section>
      </section>
	  
      <section class="space-y-4">
        <div class="rounded-2xl border border-zinc-200 bg-zinc-200/30 p-4">
		  <div class="flex items-center gap-2">
			<button id="prevMonth" class="rounded-full min-w-[2rem] min-h-[2rem] border border-zinc-800 hover:bg-zinc-200 p-0 m-0" 
				title="Mês anterior" aria-label="Mês anterior">
				<span class="text-[1rem] p-0 m-0">‹</span>
				</button>
			<div id="monthLabel" class="min-w-fit w-full font-semibold text-center text-sm"></div>
			<button id="nextMonth" class="rounded-full min-w-[2rem] min-h-[2rem] border border-zinc-800 hover:bg-zinc-200 p-0 m-0" 
				title="Próximo mês" aria-label="Próximo mês">
				<span class="text-[1rem] p-0 m-0">›</span>
			</button>
		  </div>
        </div>
        <div class="rounded-2xl border border-zinc-200 bg-zinc-200/30 p-4">
          <div class="space-y-3">
            <label for="valorHora" class="block text-[0.70rem] font-medium tracking-wide">VALOR HORA</label>
            <input id="valorHora" type="number" inputmode="decimal" placeholder="0,00" min="0"
			class="w-full rounded-xl border border-zinc-400 bg-zinc-100 px-3 py-2 placeholder-zinc-600 outline-none focus:border-zinc-700" />
            
			<label for="horas" class="block text-[0.70rem] font-medium tracking-wide">HORAS TRABALHADAS</label>
            <input id="horas" type="number" inputmode="decimal" placeholder="8" min="0"
			class="w-full rounded-xl border border-zinc-400 bg-zinc-100 px-3 py-2 placeholder-zinc-600 outline-none focus:border-zinc-700" />
			
            <div class="flex items-center gap-3 pt-2">
              <button id="modeWorked" 
			  class="h-9 w-9 rounded-full bg-emerald-600 ring-0 ring-emerald-400/80 ring-offset-2 ring-offset-zinc-200 transition hover:brightness-110" 
			  title="Marcar como trabalhado" aria-label="Marcar como trabalhado"></button>
			  
              <button id="modeNotWorked" 
			  class="h-9 w-9 rounded-full bg-red-600 ring-0 ring-red-400/80 ring-offset-2 ring-offset-zinc-200 transition hover:brightness-110" 
			  title="Marcar como não trabalhado" aria-label="Marcar como não trabalhado"></button>
            </div>
          </div>
        </div>
		<button id="calcBtn" class="w-full py-2 border-2 border-zinc-950 bg-zinc-950 text-[0.70rem] font-medium tracking-wide text-zinc-200">CALCULAR</button>
		<hr>
		<button id="selectAllBtn" class="w-full py-2 border-2 border-zinc-950 text-[0.70rem] font-medium tracking-wide text-zinc-950">MARCAR TODOS OS DIAS ÚTEIS</button>
		<button id="clearAllBtn" class="w-full py-2 border-2 border-zinc-950 text-[0.70rem] font-medium tracking-wide text-zinc-950">DESMARCAR TUDO</button>
      </section>
    </div>
  </div>

  <script>
  const monthState = new Map();

  // Cache de feriados por ano (BrasilAPI) e do mês atual
  const holidayYearCache = new Map();
  let currentMonthHolidays = new Map();
  
  let view = (function () {
    const now = new Date();
    return { year: now.getFullYear(), month: now.getMonth() };
  })();
  
  let mode = 'worked';
  
  const monthLabelEl = document.getElementById('monthLabel');
  const gridEl = document.getElementById('calendarGrid');
  const btnPrev = document.getElementById('prevMonth');
  const btnNext = document.getElementById('nextMonth');
  const btnCalc = document.getElementById('calcBtn');
  const btnWorked = document.getElementById('modeWorked');
  const btnNotWorked = document.getElementById('modeNotWorked');
  const btnSelectAll = document.getElementById('selectAllBtn');
  const btnClearAll = document.getElementById('clearAllBtn');
  const outputEl = document.getElementById('output');
  const btnCopy = document.getElementById('copyBtn');
  const iconCopy = document.getElementById('iconCopy');
  const iconCheck = document.getElementById('iconCheck');

  // Seleção em área (drag)
  let isPointerDown = false;
  let isDraggingSelection = false;
  let dragMode = null;
  let dragStartCell = null; // { year, month, day, btn }

  function updateCopyState() {
    const hasText = !!(outputEl.textContent || '').trim();
    if (btnCopy) btnCopy.disabled = !hasText;
  }

  function copyOutput() {
    const text = (outputEl.textContent || '').trim();
    if (!text) return;
    const onDone = () => {
      if (iconCopy && iconCheck) {
        iconCopy.classList.add('hidden');
        iconCheck.classList.remove('hidden');
        setTimeout(() => {
          iconCheck.classList.add('hidden');
          iconCopy.classList.remove('hidden');
        }, 1200);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(fallback);
    } else {
      fallback();
    }
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); onDone(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  const keyFor = (y, m) => `${y}-${String(m + 1).padStart(2, '0')}`;

  function getState(y, m) {
    const k = keyFor(y, m);
    if (!monthState.has(k)) {
      monthState.set(k, { 
        worked: new Set(), 
        notWorked: new Set(),
        extraHours: new Map()
      });
    } else {
      const st = monthState.get(k);
      if (!st.extraHours) st.extraHours = new Map();
    }
    return monthState.get(k);
  }

  function sundayOffset(dayIndex) {
    return dayIndex;
  }

  function formatMonth(y, m) {
    const s = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(new Date(y, m, 1));
    return s.replace(' de ', ' ').replace(/^./, c => c.toUpperCase());
  }

  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  function formatBRL(n) {
    return brl.format(n).replace(/\s/g, '');
  }

  function parseBRNumber(str) {
    if (typeof str !== 'string') return NaN;
    let s = str.trim();
    if (!s) return NaN;
    s = s.replace(/[R$\s]/g, '');
    if (/,/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    return parseFloat(s);
  }

  function formatHours(n) {
    if (!Number.isFinite(n)) return '';
    const s = n.toFixed(2).replace(/\.00$/, '').replace(/(\.\d[1-9])0$/, '$1');
    return s.replace('.', ',') + 'h';
  }

  function setMode(newMode) {
    mode = newMode;
    if (mode === 'worked') {
      btnWorked.classList.add('ring-4');
      btnNotWorked.classList.remove('ring-4');
    } else {
      btnNotWorked.classList.add('ring-4');
      btnWorked.classList.remove('ring-4');
    }
  }

  function formatHolidayName(name) {
    if (!name) return '';
    const smallWords = ['da', 'de', 'do', 'das', 'dos', 'e'];
    return String(name)
      .toLowerCase()
      .split(' ')
      .map((word, index) => {
        if (smallWords.includes(word) && index !== 0) return word;
        return word.charAt(0).toUpperCase() + word.slice(1);
      })
      .join(' ');
  }

  // --------- Feriados (BrasilAPI) ---------

  async function fetchHolidaysForYear(year) {
    if (holidayYearCache.has(year)) {
      const cached = holidayYearCache.get(year);
      if (Array.isArray(cached)) return cached;
      if (cached && cached.__promise) return cached.__promise;
    }
    const promise = fetch(`https://brasilapi.com.br/api/feriados/v1/${year}`)
      .then(resp => (resp.ok ? resp.json() : []))
      .catch(err => {
        console.error('Erro ao buscar feriados', err);
        return [];
      });
    holidayYearCache.set(year, { __promise: promise });
    const data = await promise;
    if (!Array.isArray(data)) {
      holidayYearCache.set(year, []);
      return [];
    }
    holidayYearCache.set(year, data);
    return data;
  }

  async function getHolidaysForMonth(year, monthIndex) {
    const all = await fetchHolidaysForYear(year);
    const monthStr = String(monthIndex + 1).padStart(2, '0');
    const map = new Map();
    for (const h of all) {
      if (!h || !h.date) continue;
      const dateStr = String(h.date);
      if (dateStr.slice(5, 7) === monthStr) {
        const day = parseInt(dateStr.slice(8, 10), 10);
        if (!Number.isNaN(day)) {
          map.set(day, h);
        }
      }
    }
    return map;
  }

  function getHolidayNameFromCurrentMonth(day) {
    if (!currentMonthHolidays) return null;
    const h = currentMonthHolidays.get(day);
    return h && h.name ? formatHolidayName(h.name) : null;
  }

  function updateDayVisual(btn, y, m, d, monthHolidays) {
    const st = getState(y, m);
    const extra = st.extraHours.get(d) || 0;

    btn.className = 'aspect-square select-none rounded-xl text-sm transition flex items-center justify-center hover:bg-zinc-200';
    btn.style = '';
    btn.textContent = String(d);

    const worked = st.worked.has(d);
    const notWorked = st.notWorked.has(d);

    if (worked) {
      btn.classList.add('bg-emerald-600', 'text-white', 'hover:bg-emerald-700');
    } else if (notWorked) {
      btn.classList.add('bg-red-500', 'text-white', 'hover:bg-red-600');
    }

    const titleParts = [];

    if (monthHolidays && monthHolidays.has(d)) {
      const holiday = monthHolidays.get(d);
      btn.classList.add('text-blue-500', 'font-bold');
	  btn.style = 'text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff,'
             + '1px 1px #fff, -1px -1px #fff, 1px -1px #fff, -1px 1px #fff';
      btn.classList.remove('text-white');
      if (holiday && holiday.name) {
        titleParts.push(formatHolidayName(holiday.name));
      }
    }

    if (extra > 0) {
      const extraStr = String(extra).replace('.', ',');
      titleParts.push(`Dias com horas extras: ${extraStr}h`);
      btn.classList.add('text-purple-500', 'font-bold');
	  btn.style = 'text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff,'
             + '1px 1px #fff, -1px -1px #fff, 1px -1px #fff, -1px 1px #fff';
    }

    if (titleParts.length > 0) {
      btn.title = titleParts.join(' | ');
    } else {
      btn.title = '';
    }
  }

  // Aplica ação em um dia (toggle para clique, set para drag)
  function applyDayAction(y, m, d, modeToApply, options) {
    const st = getState(y, m);
    const toggle = options && options.toggle;

    if (modeToApply === 'worked') {
      if (toggle) {
        if (st.worked.has(d)) {
          st.worked.delete(d);
        } else {
          st.worked.add(d);
          st.notWorked.delete(d);
        }
      } else {
        if (!st.worked.has(d)) {
          st.worked.add(d);
          st.notWorked.delete(d);
        }
      }
    } else { // 'notWorked'
      if (toggle) {
        if (st.notWorked.has(d)) {
          st.notWorked.delete(d);
        } else {
          st.notWorked.add(d);
          st.worked.delete(d);
        }
      } else {
        if (!st.notWorked.has(d)) {
          st.notWorked.add(d);
          st.worked.delete(d);
        }
      }
    }
  }

  // Editar horas extras de um dia (botão direito)
  function editExtraHoursForDay(year, month, day, btn) {
    const st = getState(year, month);
    const current = st.extraHours.get(day) || 0;
    const currentStr = current ? String(current).replace('.', ',') : '';
    const input = prompt(
      `Horas extras para o dia ${day} (use vírgula ou ponto).\n` +
      'Deixe em branco ou 0 para remover.',
      currentStr
    );
    if (input === null) return; // cancelado

    const val = parseBRNumber(input);
    if (!Number.isFinite(val) || val <= 0) {
      st.extraHours.delete(day);
    } else {
      st.extraHours.set(day, val);
      // Se marcou hora extra, faz sentido garantir que o dia é trabalhado
      applyDayAction(year, month, day, 'worked', { toggle: false });
    }
    updateDayVisual(btn, year, month, day, currentMonthHolidays);
  }

  async function renderCalendar() {
    const year = view.year;
    const month = view.month;

    monthLabelEl.textContent = formatMonth(year, month);
    gridEl.innerHTML = '';

    const first = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const offset = sundayOffset(first.getDay());

    let monthHolidays = new Map();
    try {
      monthHolidays = await getHolidaysForMonth(year, month);
    } catch (e) {
      console.error(e);
      monthHolidays = new Map();
    }

    // Se o usuário mudou de mês enquanto buscávamos os feriados, aborta este render
    if (year !== view.year || month !== view.month) {
      return;
    }

    currentMonthHolidays = monthHolidays;

    for (let i = 0; i < offset; i++) {
      const spacer = document.createElement('div');
      gridEl.appendChild(spacer);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = String(d);
      btn.setAttribute('data-day', String(d));
      updateDayVisual(btn, year, month, d, monthHolidays);

      // Clique simples (toggle)
      btn.addEventListener('click', (ev) => {
        // Se houve arraste, o clique final é ignorado
        if (isDraggingSelection) {
          isDraggingSelection = false;
          return;
        }
        applyDayAction(year, month, d, mode, { toggle: true });
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });

      // Início do possível arraste
      btn.addEventListener('mousedown', (ev) => {
        ev.preventDefault(); // evita seleção de texto
        isPointerDown = true;
        isDraggingSelection = false;
        dragMode = mode; // trava o modo no início do arraste
        dragStartCell = { year, month, day: d, btn };
      });

      // Passando por cima com o botão pressionado (arraste)
      btn.addEventListener('mouseenter', () => {
        if (!isPointerDown || !dragMode) return;

        // Primeira vez que detectamos arraste: incluímos também o dia inicial
        if (!isDraggingSelection) {
          isDraggingSelection = true;
          if (dragStartCell) {
            const { year: sy, month: sm, day: sd, btn: sbtn } = dragStartCell;
            applyDayAction(sy, sm, sd, dragMode, { toggle: false });
            updateDayVisual(sbtn, sy, sm, sd, currentMonthHolidays);
            dragStartCell = null;
          }
        }

        // Dia atual sob o mouse
        applyDayAction(year, month, d, dragMode, { toggle: false });
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });

      // Botão direito: editar horas extras
      btn.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        editExtraHoursForDay(year, month, d, btn);
      });

      gridEl.appendChild(btn);
    }
  }

  // Quando soltar o botão do mouse, paramos o arraste,
  // mas mantemos isDraggingSelection até o clique final,
  // para que o click não faça toggle.
  window.addEventListener('mouseup', () => {
    isPointerDown = false;
    dragMode = null;
    dragStartCell = null;
    // isDraggingSelection será limpo no clique final, se existir.
  });

  function calculate() {
    const v = parseBRNumber(document.getElementById('valorHora').value);
    const h = parseBRNumber(document.getElementById('horas').value);

    if (!Number.isFinite(v) || !Number.isFinite(h)) {
      outputEl.textContent = 'Preencha Valor Hora e Horas trabalhadas corretamente.';
      updateCopyState();
      return;
    }

    const st = getState(view.year, view.month);
    const workedDays = Array.from(st.worked).sort((a, b) => a - b);
    const notWorkedDays = Array.from(st.notWorked).sort((a, b) => a - b);
    const extraMap = st.extraHours || new Map();

    const basePerDayCents = Math.round(v * h * 100);
    const baseTotalCents = basePerDayCents * workedDays.length;

    let extraHoursTotal = 0;
    let extraTotalCents = 0;
    const overtimeDescriptions = [];

    for (const day of workedDays) {
      const extraH = extraMap.get(day) || 0;
      if (extraH > 0) {
        extraHoursTotal += extraH;
        extraTotalCents += Math.round(v * extraH * 100);
        const extraStr = String(extraH).replace('.', ',');
        overtimeDescriptions.push(`${day} (+${extraStr}h)`);
      }
    }

    const totalCents = baseTotalCents + extraTotalCents;

    const vText = formatBRL(v);
    const hText = formatHours(h);
    const perDayText = formatBRL(basePerDayCents / 100);
    const baseTotalText = formatBRL(baseTotalCents / 100);
    const extraTotalText = formatBRL(extraTotalCents / 100);
    const totalText = formatBRL(totalCents / 100);

    let result = '';
    result += 'Valor Hora x Horas trabalhadas (por dia)\n';
    result += `${vText} x ${hText} = ${perDayText}\n\n`;

    result += 'Dias trabalhados:\n';
    result += workedDays.length ? workedDays.join(', ') : '—';

    if (notWorkedDays.length) {
      const notWorkedWithHolidays = notWorkedDays.map(d => {
        const holidayName = getHolidayNameFromCurrentMonth(d);
        return holidayName ? `${d} (${holidayName})` : String(d);
      });
      result += `\n\nDias não trabalhados:\n${notWorkedWithHolidays.join(', ')}`;
    }

    if (overtimeDescriptions.length) {
      result += `\n\nDias com horas extras:\n${overtimeDescriptions.join(', ')}`;
      result += `\nTotal: ${formatHours(extraHoursTotal)}`;
    }

    result += '\n\nResumo:\n';
    result += `${perDayText} x ${workedDays.length}d = ${baseTotalText}`;
    if (extraTotalCents > 0) {
      result += `\n${vText} x ${formatHours(extraHoursTotal)} (extras) = ${extraTotalText}`;
    }
    result += `\nTotal: ${totalText}`;

    outputEl.textContent = result;
    updateCopyState();
  }

  // --- MARCAR TODOS OS DIAS ÚTEIS (seg–sex), respeitando feriados e modo atual ---
  if (btnSelectAll) {
    btnSelectAll.addEventListener('click', () => {
      const year = view.year;
      const month = view.month;
      const monthHolidays = currentMonthHolidays || new Map();

      const buttons = gridEl.querySelectorAll('button[data-day]');
      buttons.forEach(btn => {
        const d = parseInt(btn.getAttribute('data-day'), 10);
        if (Number.isNaN(d)) return;

        const date = new Date(year, month, d);
        const dayOfWeek = date.getDay(); // 0 = dom, 6 = sáb

        // só dias úteis
        if (dayOfWeek === 0 || dayOfWeek === 6) return;

        // não marcar feriados
        if (monthHolidays.has(d)) return;

        applyDayAction(year, month, d, mode, { toggle: false });
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });
    });
  }

  // --- DESMARCAR TUDO DO MÊS ATUAL ---
  if (btnClearAll) {
    btnClearAll.addEventListener('click', () => {
      const year = view.year;
      const month = view.month;
      const st = getState(year, month);
      st.worked.clear();
      st.notWorked.clear();
      if (st.extraHours) st.extraHours.clear();

      const buttons = gridEl.querySelectorAll('button[data-day]');
      buttons.forEach(btn => {
        const d = parseInt(btn.getAttribute('data-day'), 10);
        if (Number.isNaN(d)) return;
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });
    });
  }

  btnPrev.addEventListener('click', () => {
    if (view.month === 0) {
      view.month = 11;
      view.year -= 1;
    } else {
      view.month -= 1;
    }
    renderCalendar();
    updateCopyState();
  });

  btnNext.addEventListener('click', () => {
    if (view.month === 11) {
      view.month = 0;
      view.year += 1;
    } else {
      view.month += 1;
    }
    renderCalendar();
    updateCopyState();
  });

  btnCalc.addEventListener('click', calculate);
  btnWorked.addEventListener('click', () => setMode('worked'));
  btnNotWorked.addEventListener('click', () => setMode('notWorked'));
  if (btnCopy) btnCopy.addEventListener('click', copyOutput);

  setMode('worked');
  renderCalendar();
  updateCopyState();
</script>

</body>
</html>
