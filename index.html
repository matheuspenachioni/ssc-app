<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de Salário</title>
  <script>
    tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          boxShadow: {
            soft: '0 10px 35px -15px rgba(15, 23, 42, 0.35)'
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-zinc-100 to-indigo-100 text-slate-800 antialiased transition-colors duration-300 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 dark:text-slate-100">
  <div class="mx-auto max-w-6xl p-4 sm:p-6 lg:p-8">
    <header class="mb-6 rounded-2xl border border-white/30 bg-white/70 p-4 shadow-soft backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/70">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-xs font-medium uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Planejamento mensal</p>
          <h1 class="text-2xl font-semibold tracking-tight">O Calendário</h1>
        </div>

        <button id="themeToggle" type="button" class="group inline-flex items-center gap-3 rounded-full border border-slate-300 bg-white px-2 py-1 text-sm font-medium shadow-sm transition-all hover:scale-[1.02] hover:border-slate-400 dark:border-slate-600 dark:bg-slate-800 dark:hover:border-slate-500" aria-label="Alternar tema" title="Alternar tema">
          <span class="relative inline-flex h-7 w-12 items-center rounded-full bg-slate-300 p-1 transition-colors duration-300 dark:bg-slate-700">
            <span id="toggleDot" class="h-5 w-5 rounded-full bg-white shadow transition-transform duration-300 ease-out dark:translate-x-5 dark:bg-indigo-300"></span>
          </span>
          <span id="themeLabel" class="text-slate-700 dark:text-slate-200">Tema claro</span>
        </button>
      </div>
    </header>

    <div class="grid gap-6 lg:grid-cols-3">
      <section class="space-y-4 lg:col-span-2">
        <div class="rounded-2xl border border-white/40 bg-white/70 p-5 shadow-soft backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/70">
          <div class="mb-3 grid grid-cols-7 text-center text-[0.70rem] font-semibold tracking-wide text-slate-500 dark:text-slate-400">
            <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
          </div>
          <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 sm:gap-2"></div>
        </div>

        <section>
          <div class="relative rounded-2xl border border-white/40 bg-white/70 p-2 shadow-soft backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/70">
            <button id="copyBtn" class="absolute right-4 top-4 z-10 rounded-lg border border-slate-300 bg-white p-2 text-slate-700 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-40 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700" title="Copiar resultado" aria-label="Copiar resultado">
              <svg id="iconCopy" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
              <svg id="iconCheck" xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 12-12-1.5-1.5z"/></svg>
            </button>
            <div id="output" class="min-h-16 whitespace-pre-wrap rounded-xl border border-slate-200 bg-white/90 p-4 pr-12 font-mono text-sm text-slate-700 dark:border-slate-700 dark:bg-slate-800/80 dark:text-slate-100"></div>
          </div>
        </section>
      </section>

      <section class="space-y-4">
        <div class="rounded-2xl border border-white/40 bg-white/70 p-4 shadow-soft backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/70">
          <div class="flex items-center gap-2">
            <button id="prevMonth" class="inline-flex min-h-[2.25rem] min-w-[2.25rem] items-center justify-center rounded-full border border-slate-400 bg-white text-lg transition hover:bg-slate-100 dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700" title="Mês anterior" aria-label="Mês anterior">‹</button>
            <div id="monthLabel" class="w-full text-center text-sm font-semibold"></div>
            <button id="nextMonth" class="inline-flex min-h-[2.25rem] min-w-[2.25rem] items-center justify-center rounded-full border border-slate-400 bg-white text-lg transition hover:bg-slate-100 dark:border-slate-600 dark:bg-slate-800 dark:hover:bg-slate-700" title="Próximo mês" aria-label="Próximo mês">›</button>
          </div>
        </div>

        <div class="rounded-2xl border border-white/40 bg-white/70 p-4 shadow-soft backdrop-blur-xl dark:border-white/10 dark:bg-slate-900/70">
          <div class="space-y-3">
            <label for="valorHora" class="block text-[0.70rem] font-medium tracking-wide text-slate-600 dark:text-slate-300">VALOR HORA</label>
            <input id="valorHora" type="number" inputmode="decimal" placeholder="0,00" min="0" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 placeholder-slate-400 outline-none transition focus:border-indigo-500 dark:border-slate-600 dark:bg-slate-800 dark:placeholder-slate-500" />

            <label for="horas" class="block text-[0.70rem] font-medium tracking-wide text-slate-600 dark:text-slate-300">HORAS TRABALHADAS</label>
            <input id="horas" type="number" inputmode="decimal" placeholder="8" min="0" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 placeholder-slate-400 outline-none transition focus:border-indigo-500 dark:border-slate-600 dark:bg-slate-800 dark:placeholder-slate-500" />

            <div class="flex items-center gap-3 pt-2">
              <button id="modeWorked" class="h-10 w-10 rounded-full bg-emerald-600 ring-0 ring-emerald-300 ring-offset-2 ring-offset-white transition hover:brightness-110 dark:ring-offset-slate-900" title="Marcar como trabalhado" aria-label="Marcar como trabalhado"></button>
              <button id="modeNotWorked" class="h-10 w-10 rounded-full bg-red-600 ring-0 ring-red-300 ring-offset-2 ring-offset-white transition hover:brightness-110 dark:ring-offset-slate-900" title="Marcar como não trabalhado" aria-label="Marcar como não trabalhado"></button>
            </div>
          </div>
        </div>

        <button id="calcBtn" class="w-full rounded-xl border border-slate-900 bg-slate-900 py-2 text-[0.70rem] font-semibold tracking-wide text-white transition hover:bg-slate-800 dark:border-indigo-400 dark:bg-indigo-500 dark:hover:bg-indigo-400">CALCULAR</button>
        <hr class="border-slate-300 dark:border-slate-700">
        <button id="selectAllBtn" class="w-full rounded-xl border border-slate-800 py-2 text-[0.70rem] font-semibold tracking-wide text-slate-800 transition hover:bg-slate-100 dark:border-slate-500 dark:text-slate-200 dark:hover:bg-slate-800">MARCAR TODOS OS DIAS ÚTEIS</button>
        <button id="clearAllBtn" class="w-full rounded-xl border border-slate-800 py-2 text-[0.70rem] font-semibold tracking-wide text-slate-800 transition hover:bg-slate-100 dark:border-slate-500 dark:text-slate-200 dark:hover:bg-slate-800">DESMARCAR TUDO</button>
      </section>
    </div>
  </div>

  <script>
  const monthState = new Map();

  const holidayYearCache = new Map();
  let currentMonthHolidays = new Map();

  let view = (function () {
    const now = new Date();
    return { year: now.getFullYear(), month: now.getMonth() };
  })();

  let mode = 'worked';

  const htmlEl = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeLabel = document.getElementById('themeLabel');

  const monthLabelEl = document.getElementById('monthLabel');
  const gridEl = document.getElementById('calendarGrid');
  const btnPrev = document.getElementById('prevMonth');
  const btnNext = document.getElementById('nextMonth');
  const btnCalc = document.getElementById('calcBtn');
  const btnWorked = document.getElementById('modeWorked');
  const btnNotWorked = document.getElementById('modeNotWorked');
  const btnSelectAll = document.getElementById('selectAllBtn');
  const btnClearAll = document.getElementById('clearAllBtn');
  const outputEl = document.getElementById('output');
  const btnCopy = document.getElementById('copyBtn');
  const iconCopy = document.getElementById('iconCopy');
  const iconCheck = document.getElementById('iconCheck');

  let isPointerDown = false;
  let isDraggingSelection = false;
  let dragMode = null;
  let dragStartCell = null;

  function applyTheme(theme) {
    const isDark = theme === 'dark';
    htmlEl.classList.toggle('dark', isDark);
    localStorage.setItem('theme', theme);
    if (themeLabel) themeLabel.textContent = isDark ? 'Tema escuro' : 'Tema claro';
  }

  function initTheme() {
    const stored = localStorage.getItem('theme');
    if (stored === 'dark' || stored === 'light') {
      applyTheme(stored);
      return;
    }
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }

  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      const next = htmlEl.classList.contains('dark') ? 'light' : 'dark';
      applyTheme(next);
    });
  }

  function updateCopyState() {
    const hasText = !!(outputEl.textContent || '').trim();
    if (btnCopy) btnCopy.disabled = !hasText;
  }

  function copyOutput() {
    const text = (outputEl.textContent || '').trim();
    if (!text) return;
    const onDone = () => {
      if (iconCopy && iconCheck) {
        iconCopy.classList.add('hidden');
        iconCheck.classList.remove('hidden');
        setTimeout(() => {
          iconCheck.classList.add('hidden');
          iconCopy.classList.remove('hidden');
        }, 1200);
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(fallback);
    } else {
      fallback();
    }
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); onDone(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  const keyFor = (y, m) => `${y}-${String(m + 1).padStart(2, '0')}`;

  function getState(y, m) {
    const k = keyFor(y, m);
    if (!monthState.has(k)) {
      monthState.set(k, {
        worked: new Set(),
        notWorked: new Set(),
        extraHours: new Map()
      });
    } else {
      const st = monthState.get(k);
      if (!st.extraHours) st.extraHours = new Map();
    }
    return monthState.get(k);
  }

  function sundayOffset(dayIndex) {
    return dayIndex;
  }

  function formatMonth(y, m) {
    const s = new Intl.DateTimeFormat('pt-BR', { month: 'long', year: 'numeric' }).format(new Date(y, m, 1));
    return s.replace(' de ', ' ').replace(/^./, c => c.toUpperCase());
  }

  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  function formatBRL(n) {
    return brl.format(n).replace(/\s/g, '');
  }

  function parseBRNumber(str) {
    if (typeof str !== 'string') return NaN;
    let s = str.trim();
    if (!s) return NaN;
    s = s.replace(/[R$\s]/g, '');
    if (/,/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    return parseFloat(s);
  }

  function formatHours(n) {
    if (!Number.isFinite(n)) return '';
    const s = n.toFixed(2).replace(/\.00$/, '').replace(/(\.\d[1-9])0$/, '$1');
    return s.replace('.', ',') + 'h';
  }

  function setMode(newMode) {
    mode = newMode;
    if (mode === 'worked') {
      btnWorked.classList.add('ring-4');
      btnNotWorked.classList.remove('ring-4');
    } else {
      btnNotWorked.classList.add('ring-4');
      btnWorked.classList.remove('ring-4');
    }
  }

  function formatHolidayName(name) {
    if (!name) return '';
    const smallWords = ['da', 'de', 'do', 'das', 'dos', 'e'];
    return String(name)
      .toLowerCase()
      .split(' ')
      .map((word, index) => {
        if (smallWords.includes(word) && index !== 0) return word;
        return word.charAt(0).toUpperCase() + word.slice(1);
      })
      .join(' ');
  }

  async function fetchHolidaysForYear(year) {
    if (holidayYearCache.has(year)) {
      const cached = holidayYearCache.get(year);
      if (Array.isArray(cached)) return cached;
      if (cached && cached.__promise) return cached.__promise;
    }
    const promise = fetch(`https://brasilapi.com.br/api/feriados/v1/${year}`)
      .then(resp => (resp.ok ? resp.json() : []))
      .catch(err => {
        console.error('Erro ao buscar feriados', err);
        return [];
      });
    holidayYearCache.set(year, { __promise: promise });
    const data = await promise;
    if (!Array.isArray(data)) {
      holidayYearCache.set(year, []);
      return [];
    }
    holidayYearCache.set(year, data);
    return data;
  }

  async function getHolidaysForMonth(year, monthIndex) {
    const all = await fetchHolidaysForYear(year);
    const monthStr = String(monthIndex + 1).padStart(2, '0');
    const map = new Map();
    for (const h of all) {
      if (!h || !h.date) continue;
      const dateStr = String(h.date);
      if (dateStr.slice(5, 7) === monthStr) {
        const day = parseInt(dateStr.slice(8, 10), 10);
        if (!Number.isNaN(day)) map.set(day, h);
      }
    }
    return map;
  }

  function getHolidayNameFromCurrentMonth(day) {
    if (!currentMonthHolidays) return null;
    const h = currentMonthHolidays.get(day);
    return h && h.name ? formatHolidayName(h.name) : null;
  }

  function updateDayVisual(btn, y, m, d, monthHolidays) {
    const st = getState(y, m);
    const extra = st.extraHours.get(d) || 0;

    btn.className = 'aspect-square select-none rounded-xl text-sm transition flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700';
    btn.style = '';
    btn.textContent = String(d);

    const worked = st.worked.has(d);
    const notWorked = st.notWorked.has(d);

    if (worked) {
      btn.classList.add('bg-emerald-600', 'text-white', 'hover:bg-emerald-700');
    } else if (notWorked) {
      btn.classList.add('bg-red-500', 'text-white', 'hover:bg-red-600');
    } else {
      btn.classList.add('bg-white/80', 'text-slate-700', 'dark:bg-slate-800/80', 'dark:text-slate-200');
    }

    const titleParts = [];

    if (monthHolidays && monthHolidays.has(d)) {
      const holiday = monthHolidays.get(d);
      btn.classList.add('text-blue-500', 'font-bold');
      btn.style = 'text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff, 1px 1px #fff, -1px -1px #fff, 1px -1px #fff, -1px 1px #fff';
      btn.classList.remove('text-white');
      if (holiday && holiday.name) titleParts.push(formatHolidayName(holiday.name));
    }

    if (extra > 0) {
      const extraStr = String(extra).replace('.', ',');
      titleParts.push(`Dias com horas extras: ${extraStr}h`);
      btn.classList.add('text-purple-500', 'font-bold');
      btn.style = 'text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff, 1px 1px #fff, -1px -1px #fff, 1px -1px #fff, -1px 1px #fff';
    }

    btn.title = titleParts.length ? titleParts.join(' | ') : '';
  }

  function applyDayAction(y, m, d, modeToApply, options) {
    const st = getState(y, m);
    const toggle = options && options.toggle;

    if (modeToApply === 'worked') {
      if (toggle) {
        if (st.worked.has(d)) st.worked.delete(d);
        else {
          st.worked.add(d);
          st.notWorked.delete(d);
        }
      } else if (!st.worked.has(d)) {
        st.worked.add(d);
        st.notWorked.delete(d);
      }
    } else if (toggle) {
      if (st.notWorked.has(d)) st.notWorked.delete(d);
      else {
        st.notWorked.add(d);
        st.worked.delete(d);
      }
    } else if (!st.notWorked.has(d)) {
      st.notWorked.add(d);
      st.worked.delete(d);
    }
  }

  function editExtraHoursForDay(year, month, day, btn) {
    const st = getState(year, month);
    const current = st.extraHours.get(day) || 0;
    const currentStr = current ? String(current).replace('.', ',') : '';
    const input = prompt(
      `Horas extras para o dia ${day} (use vírgula ou ponto).\nDeixe em branco ou 0 para remover.`,
      currentStr
    );
    if (input === null) return;

    const val = parseBRNumber(input);
    if (!Number.isFinite(val) || val <= 0) st.extraHours.delete(day);
    else {
      st.extraHours.set(day, val);
      applyDayAction(year, month, day, 'worked', { toggle: false });
    }
    updateDayVisual(btn, year, month, day, currentMonthHolidays);
  }

  async function renderCalendar() {
    const year = view.year;
    const month = view.month;

    monthLabelEl.textContent = formatMonth(year, month);
    gridEl.innerHTML = '';

    const first = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const offset = sundayOffset(first.getDay());

    let monthHolidays = new Map();
    try {
      monthHolidays = await getHolidaysForMonth(year, month);
    } catch (e) {
      console.error(e);
      monthHolidays = new Map();
    }

    if (year !== view.year || month !== view.month) return;

    currentMonthHolidays = monthHolidays;

    for (let i = 0; i < offset; i++) {
      const spacer = document.createElement('div');
      gridEl.appendChild(spacer);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = String(d);
      btn.setAttribute('data-day', String(d));
      updateDayVisual(btn, year, month, d, monthHolidays);

      btn.addEventListener('click', () => {
        if (isDraggingSelection) {
          isDraggingSelection = false;
          return;
        }
        applyDayAction(year, month, d, mode, { toggle: true });
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });

      btn.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        isPointerDown = true;
        isDraggingSelection = false;
        dragMode = mode;
        dragStartCell = { year, month, day: d, btn };
      });

      btn.addEventListener('mouseenter', () => {
        if (!isPointerDown || !dragMode) return;

        if (!isDraggingSelection) {
          isDraggingSelection = true;
          if (dragStartCell) {
            const { year: sy, month: sm, day: sd, btn: sbtn } = dragStartCell;
            applyDayAction(sy, sm, sd, dragMode, { toggle: false });
            updateDayVisual(sbtn, sy, sm, sd, currentMonthHolidays);
            dragStartCell = null;
          }
        }

        applyDayAction(year, month, d, dragMode, { toggle: false });
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });

      btn.addEventListener('contextmenu', (ev) => {
        ev.preventDefault();
        editExtraHoursForDay(year, month, d, btn);
      });

      gridEl.appendChild(btn);
    }
  }

  window.addEventListener('mouseup', () => {
    isPointerDown = false;
    dragMode = null;
    dragStartCell = null;
  });

  function calculate() {
    const v = parseBRNumber(document.getElementById('valorHora').value);
    const h = parseBRNumber(document.getElementById('horas').value);

    if (!Number.isFinite(v) || !Number.isFinite(h)) {
      outputEl.textContent = 'Preencha Valor Hora e Horas trabalhadas corretamente.';
      updateCopyState();
      return;
    }

    const st = getState(view.year, view.month);
    const workedDays = Array.from(st.worked).sort((a, b) => a - b);
    const notWorkedDays = Array.from(st.notWorked).sort((a, b) => a - b);
    const extraMap = st.extraHours || new Map();

    const basePerDayCents = Math.round(v * h * 100);
    const baseTotalCents = basePerDayCents * workedDays.length;

    let extraHoursTotal = 0;
    let extraTotalCents = 0;
    const overtimeDescriptions = [];

    for (const day of workedDays) {
      const extraH = extraMap.get(day) || 0;
      if (extraH > 0) {
        extraHoursTotal += extraH;
        extraTotalCents += Math.round(v * extraH * 100);
        overtimeDescriptions.push(`${day} (+${String(extraH).replace('.', ',')}h)`);
      }
    }

    const totalCents = baseTotalCents + extraTotalCents;

    const vText = formatBRL(v);
    const hText = formatHours(h);
    const perDayText = formatBRL(basePerDayCents / 100);
    const baseTotalText = formatBRL(baseTotalCents / 100);
    const extraTotalText = formatBRL(extraTotalCents / 100);
    const totalText = formatBRL(totalCents / 100);

    let result = '';
    result += 'Valor Hora x Horas trabalhadas (por dia)\n';
    result += `${vText} x ${hText} = ${perDayText}\n\n`;

    result += 'Dias trabalhados:\n';
    result += workedDays.length ? workedDays.join(', ') : '—';

    if (notWorkedDays.length) {
      const notWorkedWithHolidays = notWorkedDays.map(d => {
        const holidayName = getHolidayNameFromCurrentMonth(d);
        return holidayName ? `${d} (${holidayName})` : String(d);
      });
      result += `\n\nDias não trabalhados:\n${notWorkedWithHolidays.join(', ')}`;
    }

    if (overtimeDescriptions.length) {
      result += `\n\nDias com horas extras:\n${overtimeDescriptions.join(', ')}`;
      result += `\nTotal: ${formatHours(extraHoursTotal)}`;
    }

    result += '\n\nResumo:\n';
    result += `${perDayText} x ${workedDays.length}d = ${baseTotalText}`;
    if (extraTotalCents > 0) result += `\n${vText} x ${formatHours(extraHoursTotal)} (extras) = ${extraTotalText}`;
    result += `\nTotal: ${totalText}`;

    outputEl.textContent = result;
    updateCopyState();
  }

  if (btnSelectAll) {
    btnSelectAll.addEventListener('click', () => {
      const year = view.year;
      const month = view.month;
      const monthHolidays = currentMonthHolidays || new Map();

      const buttons = gridEl.querySelectorAll('button[data-day]');
      buttons.forEach(btn => {
        const d = parseInt(btn.getAttribute('data-day'), 10);
        if (Number.isNaN(d)) return;

        const date = new Date(year, month, d);
        const dayOfWeek = date.getDay();

        if (dayOfWeek === 0 || dayOfWeek === 6) return;
        if (monthHolidays.has(d)) return;

        applyDayAction(year, month, d, mode, { toggle: false });
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });
    });
  }

  if (btnClearAll) {
    btnClearAll.addEventListener('click', () => {
      const year = view.year;
      const month = view.month;
      const st = getState(year, month);
      st.worked.clear();
      st.notWorked.clear();
      if (st.extraHours) st.extraHours.clear();

      const buttons = gridEl.querySelectorAll('button[data-day]');
      buttons.forEach(btn => {
        const d = parseInt(btn.getAttribute('data-day'), 10);
        if (Number.isNaN(d)) return;
        updateDayVisual(btn, year, month, d, currentMonthHolidays);
      });
    });
  }

  btnPrev.addEventListener('click', () => {
    if (view.month === 0) {
      view.month = 11;
      view.year -= 1;
    } else {
      view.month -= 1;
    }
    renderCalendar();
    updateCopyState();
  });

  btnNext.addEventListener('click', () => {
    if (view.month === 11) {
      view.month = 0;
      view.year += 1;
    } else {
      view.month += 1;
    }
    renderCalendar();
    updateCopyState();
  });

  btnCalc.addEventListener('click', calculate);
  btnWorked.addEventListener('click', () => setMode('worked'));
  btnNotWorked.addEventListener('click', () => setMode('notWorked'));
  if (btnCopy) btnCopy.addEventListener('click', copyOutput);

  initTheme();
  setMode('worked');
  renderCalendar();
  updateCopyState();
  </script>

</body>
</html>
